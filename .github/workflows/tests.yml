name: DineDesk Security Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  security-tests:
    name: Authentication and Authorization Tests
    runs-on: ubuntu-latest

    env:
      # Dummy test-only value signing key.
      JWT_SECRET: ci-test-only-secret-at-least-32-characters-long
      JWT_ISSUER: dinedesk-api
      JWT_AUDIENCE: dinedesk-staff
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run security tests
        run: npm test