
name: DineDesk Secret Handling Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Confirm demo secret is configured
        env:
          DINEDESK_DEMO_KEY: ${{ secrets.DINEDESK_DEMO_KEY }}
        run: |
          if [ -n "$DINEDESK_DEMO_KEY" ]; then
            echo "DINEDESK_DEMO_KEY is configured."
          else
            echo "::error::DINEDESK_DEMO_KEY is missing."
            exit 1
          fi
